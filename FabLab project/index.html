<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Title/description below are the French defaults; js/main.js swaps them when the language changes -->
  <title>Re-Imagine – FabLab Solidaire | ENISO Sousse</title>
  <meta name="description" content="FabLab ouvert à tous à l'ENISO, Sousse : découpe laser, impression 3D, CNC, réalité virtuelle et accompagnement de projets. Demandez votre devis.">
  <meta name="theme-color" content="#0B2545">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Re-Imagine – FabLab Solidaire">
  <meta property="og:title" content="Re-Imagine – FabLab Solidaire | ENISO Sousse">
  <meta property="og:description" content="FabLab ouvert à tous à l'ENISO, Sousse. Demandez votre devis.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta property="og:locale" content="fr_FR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="home">
  <!-- Header is generated by js/main.js -->
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1">
    <!-- HERO -->
    <section class="hero">
      <div class="container hero-grid">
        <div class="hero-copy">
          <p class="kicker" data-i18n="home.hero.kicker"></p>
          <h1>
            <span class="line" data-i18n="home.hero.title1"></span>
            <span class="line"><span class="highlight" data-i18n="home.hero.title2"></span></span>
          </h1>
          <p class="hero-lead" data-i18n="home.hero.lead"></p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="quote.html"><span data-i18n="cta.quote"></span><span data-icon="arrowRight"></span></a>
            <a class="btn btn-outline btn-lg" href="equipment.html" data-i18n="cta.equipment"></a>
          </div>
        </div>
        <div class="hero-visual">
          <div class="hero-photo">
            <img src="assets/img/lab/workshop.webp"
                 srcset="assets/img/lab/workshop-sm.webp 720w, assets/img/lab/workshop.webp 1280w"
                 sizes="(min-width: 960px) 50vw, 100vw"
                 width="1280" height="960" fetchpriority="high"
                 alt="" data-i18n-attr="alt:home.hero.imgAlt">
          </div>
          <p class="hero-badge"><span data-icon="checkCircle"></span><span data-i18n="home.hero.badge"></span></p>
        </div>
      </div>
    </section>

    <!-- SERVICES OVERVIEW -->
    <section class="section section-soft" aria-labelledby="services-title">
      <div class="container">
        <div class="section-head center">
          <p class="kicker" data-i18n="home.services.kicker"></p>
          <h2 id="services-title" data-i18n="home.services.title"></h2>
          <p data-i18n="home.services.lead"></p>
        </div>
        <div class="grid grid-5" data-render="services-short"></div>
        <div class="section-foot center">
          <a class="btn btn-outline" href="services.html" data-i18n="cta.allServices"></a>
        </div>
      </div>
    </section>

    <!-- FEATURED MACHINES -->
    <section class="section" aria-labelledby="machines-title">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-i18n="home.machines.kicker"></p>
          <h2 id="machines-title" data-i18n="home.machines.title"></h2>
          <p data-i18n="home.machines.lead"></p>
        </div>
        <div class="scroll-strip" data-render="machines-featured"></div>
        <div class="section-foot">
          <a class="btn btn-outline" href="equipment.html" data-i18n="cta.allEquipment"></a>
        </div>
      </div>
    </section>

    <!-- PROJECTS TEASER -->
    <section class="section section-soft" aria-labelledby="projects-title">
      <div class="container">
        <div class="section-head">
          <p class="kicker" data-i18n="home.projects.kicker"></p>
          <h2 id="projects-title" data-i18n="home.projects.title"></h2>
        </div>
        <div class="grid grid-3" data-render="projects-teaser"></div>
        <div class="section-foot">
          <a class="btn btn-outline" href="projects.html" data-i18n="cta.allProjects"></a>
        </div>
      </div>
    </section>

    <!-- ENISO STUDENT DISCOUNT -->
    <section class="section section-tight">
      <div class="container">
        <div class="discount-banner reveal">
          <span class="icon-badge" data-icon="cap"></span>
          <div>
            <h2 data-i18n="home.discount.title"></h2>
            <p data-i18n="home.discount.text"></p>
          </div>
          <a class="btn btn-primary" href="quote.html?status=eniso" data-i18n="home.discount.cta"></a>
        </div>
      </div>
    </section>

    <!-- PARTNERS -->
    <section class="section section-tight" aria-labelledby="partners-title">
      <div class="container partners-block">
        <p class="kicker" id="partners-title" data-i18n="label.partners"></p>
        <p class="partners-line" data-i18n="label.partnersLine"></p>
        <div data-render="partners"></div>
      </div>
    </section>

    <!-- FINAL CTA -->
    <section class="section">
      <div class="container">
        <div class="final-cta reveal">
          <h2 data-i18n="home.final.title"></h2>
          <p data-i18n="home.final.text"></p>
          <div class="hero-actions">
            <a class="btn btn-primary btn-lg" href="quote.html" data-i18n="cta.quote"></a>
            <a class="btn btn-outline btn-lg" href="contact.html" data-i18n="cta.contact"></a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer is generated by js/main.js -->
  <footer id="site-footer" class="site-footer"></footer>

  <noscript><p style="padding:16px;text-align:center">Activez JavaScript pour afficher ce site. / Please enable JavaScript to view this site.</p></noscript>
  <script src="js/content.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
