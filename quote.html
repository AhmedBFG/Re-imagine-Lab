<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demander un devis | Re-Imagine FabLab Solidaire</title>
  <meta name="description" content="Décrivez votre projet et recevez un devis personnalisé. Tarif spécial pour les étudiants de l'ENISO.">
  <meta name="theme-color" content="#0B2545">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Re-Imagine – FabLab Solidaire">
  <meta property="og:title" content="Demander un devis | Re-Imagine FabLab Solidaire">
  <meta property="og:description" content="Décrivez votre projet et recevez un devis personnalisé.">
  <meta property="og:image" content="assets/img/og-image.jpg">
  <meta property="og:locale" content="fr_FR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="quote">
  <header id="site-header" class="site-header"></header>

  <main id="main" tabindex="-1">
    <section class="page-hero">
      <div class="container">
        <p class="kicker" data-i18n="quote.hero.kicker"></p>
        <h1 data-i18n="quote.hero.title"></h1>
        <p data-i18n="quote.hero.lead"></p>
      </div>
    </section>

    <section class="section">
      <div class="container quote-layout">
        <div class="form-card">
          <!-- Error summary (shown on submit if something is wrong) -->
          <div id="form-summary" class="alert" role="alert" tabindex="-1" hidden>
            <span data-icon="alert"></span><span data-summary-text></span>
          </div>

          <!-- QUOTE FORM: sending is handled in js/quote-form.js (endpoint set in js/content.js) -->
          <form id="quote-form" novalidate>
            <p id="discount-note" class="discount-note"><span data-icon="cap"></span><span data-i18n="quote.discount"></span></p>
            <p class="form-required" data-i18n="quote.required"></p>

            <h2 class="form-legend" data-i18n="quote.section.you"></h2>
            <div class="form-grid">
              <div class="field" data-field="name">
                <label for="f-name"><span data-i18n="quote.name"></span><span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="err-name">
                <p class="field-error" id="err-name"></p>
              </div>
            </div>
            <div class="form-grid form-grid-2">
              <div class="field" data-field="email">
                <label for="f-email"><span data-i18n="quote.email"></span><span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="f-email" name="email" type="email" autocomplete="email" inputmode="email" required aria-describedby="err-email">
                <p class="field-error" id="err-email"></p>
              </div>
              <div class="field" data-field="phone">
                <label for="f-phone"><span data-i18n="quote.phone"></span><span class="req" aria-hidden="true">*</span></label>
                <input class="input" id="f-phone" name="phone" type="tel" autocomplete="tel" inputmode="tel" required
                       data-i18n-attr="placeholder:quote.phoneHint" aria-describedby="err-phone">
                <p class="field-error" id="err-phone"></p>
              </div>
            </div>

            <fieldset class="field" data-field="status">
              <legend><span data-i18n="quote.status"></span><span class="req" aria-hidden="true">*</span></legend>
              <div class="choice-group choice-group-4">
                <label class="choice"><input type="radio" name="status" value="eniso" required aria-describedby="err-status"><span data-i18n="quote.status.eniso"></span></label>
                <label class="choice"><input type="radio" name="status" value="student" aria-describedby="err-status"><span data-i18n="quote.status.student"></span></label>
                <label class="choice"><input type="radio" name="status" value="company" aria-describedby="err-status"><span data-i18n="quote.status.company"></span></label>
                <label class="choice"><input type="radio" name="status" value="individual" aria-describedby="err-status"><span data-i18n="quote.status.individual"></span></label>
              </div>
              <p class="field-error" id="err-status"></p>
            </fieldset>

            <h2 class="form-section-title" data-i18n="quote.section.project"></h2>
            <div class="form-grid form-grid-2">
              <div class="field" data-field="service">
                <label for="f-service"><span data-i18n="quote.service"></span><span class="req" aria-hidden="true">*</span></label>
                <!-- options are filled from DATA.services -->
                <select class="input" id="f-service" name="service" required aria-describedby="err-service"></select>
                <p class="field-error" id="err-service"></p>
              </div>
              <div class="field" data-field="machine">
                <label for="f-machine" data-i18n="quote.machine"></label>
                <!-- options are filled from DATA.machines -->
                <select class="input" id="f-machine" name="machine"></select>
              </div>
            </div>

            <div class="form-grid">
              <div class="field" data-field="description">
                <label for="f-description"><span data-i18n="quote.description"></span><span class="req" aria-hidden="true">*</span></label>
                <textarea class="input" id="f-description" name="description" rows="6" required
                          data-i18n-attr="placeholder:quote.descriptionHint" aria-describedby="err-description"></textarea>
                <p class="field-error" id="err-description"></p>
              </div>

              <div class="field" data-field="file">
                <label for="f-file" data-i18n="quote.file"></label>
                <div class="file-drop">
                  <span data-icon="upload"></span>
                  <div>
                    <p class="hint" id="hint-file" data-i18n="quote.fileHint"></p>
                    <p class="file-name" id="file-name" aria-live="polite"></p>
                  </div>
                  <input id="f-file" name="file" type="file"
                         accept=".pdf,.png,.jpg,.jpeg,.webp,.svg,.dxf,.dwg,.stl,.step,.stp,.obj,.zip"
                         aria-describedby="hint-file err-file">
                </div>
                <p class="field-error" id="err-file"></p>
              </div>
            </div>

            <fieldset class="field" data-field="contactMethod">
              <legend><span data-i18n="quote.contactMethod"></span><span class="req" aria-hidden="true">*</span></legend>
              <div class="choice-group choice-group-3">
                <label class="choice"><input type="radio" name="contactMethod" value="email" checked aria-describedby="err-contactMethod"><span data-i18n="quote.contact.email"></span></label>
                <label class="choice"><input type="radio" name="contactMethod" value="phone" aria-describedby="err-contactMethod"><span data-i18n="quote.contact.phone"></span></label>
                <label class="choice"><input type="radio" name="contactMethod" value="whatsapp" aria-describedby="err-contactMethod"><span data-i18n="quote.contact.whatsapp"></span></label>
              </div>
              <p class="field-error" id="err-contactMethod"></p>
            </fieldset>

            <!-- Anti-spam: humans never see or fill this field -->
            <div class="honeypot" aria-hidden="true">
              <label for="f-gotcha">Leave empty</label>
              <input id="f-gotcha" name="_gotcha" type="text" tabindex="-1" autocomplete="off">
            </div>

            <div class="form-actions">
              <button class="btn btn-primary btn-lg" type="submit"><span data-i18n="quote.submit"></span><span data-icon="arrowRight"></span></button>
              <p class="hint" data-i18n="quote.privacy"></p>
            </div>
          </form>

          <!-- Shown after a successful send (endpoint mode) -->
          <div id="quote-success" class="result-panel" hidden>
            <span class="icon-badge" data-icon="checkCircle"></span>
            <h2 tabindex="-1" data-i18n="quote.success.title"></h2>
            <p data-i18n="quote.success.text"></p>
            <div class="hero-actions">
              <button type="button" class="btn btn-outline" data-form-reset data-i18n="quote.again"></button>
            </div>
          </div>

          <!-- Shown after opening the email app (no endpoint configured yet) -->
          <div id="quote-mailto" class="result-panel" hidden>
            <span class="icon-badge" data-icon="mail"></span>
            <h2 tabindex="-1" data-i18n="quote.mailto.title"></h2>
            <p data-i18n="quote.mailto.text"></p>
            <div class="hero-actions">
              <button type="button" class="btn btn-primary" id="mailto-retry" data-i18n="quote.mailto.retry"></button>
              <button type="button" class="btn btn-outline" data-form-reset data-i18n="quote.again"></button>
            </div>
          </div>
        </div>

        <aside class="aside-card" aria-labelledby="aside-title">
          <h2 id="aside-title" data-i18n="quote.aside.title"></h2>
          <p data-i18n="quote.aside.text"></p>
          <div data-render="quick-contact"></div>
          <p class="aside-hours"><span data-icon="clock"></span><span data-render="hours"></span></p>
        </aside>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>

  <noscript><p style="padding:16px;text-align:center">Activez JavaScript pour afficher ce site. / Please enable JavaScript to view this site.</p></noscript>
  <script src="js/content.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/main.js"></script>
  <script src="js/quote-form.js"></script>
</body>
</html>
